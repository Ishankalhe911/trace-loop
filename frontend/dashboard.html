<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workspace · Trace-Loop</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">

<nav class="site-nav"></nav>

<!-- Dashboard header -->
<div class="dash-header">
  <div class="container">
    <div class="dash-header-inner">
      <div>
        <h1>
          Good day, <span id="welcome-name">—</span>
          <small id="role-label"></small>
        </h1>
        <div style="display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap">
          <span id="account-status"></span>
          <span class="muted" style="font-size:.8rem">ID: <span class="mono" id="user-id">—</span></span>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap" id="dash-actions">
        <!-- filled by JS based on role -->
      </div>
    </div>
  </div>
</div>

<div class="dashboard-wrap">
  <div class="container">
    <div id="dashboard-content">
      <div class="loading">Loading your workspace…</div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <span>Trace-Loop · IEEE YESIST12 2026</span>
      <a href="track.html">Track a device</a>
    </div>
  </div>
</footer>

<script src="js/script.js"></script>
</body>
</html>
